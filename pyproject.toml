[project]
name = "prism"
version = "1.0.1"
description = "PRISM — a research-grade desktop benchmark for prompt-reliability in small language models"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "psutil>=5.9",
    "reportlab>=4.0",
]

[project.scripts]
prism = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"